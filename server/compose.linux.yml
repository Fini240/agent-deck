services:
  agentdeck:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: agentdeck
    hostname: ${AGENTDECK_HOST_NAME:-agentdeck-host}
    restart: unless-stopped
    init: true
    network_mode: host
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${AGENTDECK_DATA_DIR:-/DATA/AppData/agent-deck}/runtime.env
    volumes:
      - ${AGENTDECK_DATA_DIR:-/DATA/AppData/agent-deck}/home:/home/agentdeck
      - ${AGENTDECK_DATA_DIR:-/DATA/AppData/agent-deck}/workspace:/workspace
      - ${AGENTDECK_DATA_DIR:-/DATA/AppData/agent-deck}/downloads:/downloads:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
